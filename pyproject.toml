[project]
name = "unitree_rl_mjlab"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mjlab==1.2.0",
    "mujoco==3.6.0",
    "mujoco-warp==3.6.0",
    "warp-lang==1.12.1",
    "torch==2.11.0",
    "numpy==2.4.4",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
