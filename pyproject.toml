[project]
name = "unitree_rl_mjlab"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mjlab==1.2.0",
    "mujoco==3.6.0",
    "mujoco-warp==3.6.0",
    "warp-lang==1.12.1",
    "torch==2.11.0",
    "numpy==2.4.4",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# torch 2.11 on PyPI is a CUDA-13 build (Turing/sm_75+ only, no V100). The
# CUDA-12.6 build keeps Volta/sm_70, so it runs on both V100 and A100.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
